<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>sing-rules</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><b>sing-rules</b><nav id="nav"></nav></header><main>
<div id="message" role="status" aria-live="polite"></div>
<section id="login"><h1>登录</h1><button id="idp">使用身份提供商登录</button><form id="local"><label>管理员密码<input name="password" type="password" autocomplete="current-password" required></label><button>密码登录</button></form></section>
<section id="profile" hidden><h1>我的身份</h1><dl id="identity"></dl></section>
<section id="configs" hidden><h1>配置文件</h1><form id="newconfig"><label>备注<input name="note" required></label><button>新建空配置</button></form><div id="configlist"></div>
<article id="editor" hidden><h2 id="editing"></h2><form id="sources"><label>配置备注<input name="note" required></label><label>规则源文件（.sr）<input type="file" name="sr" accept=".sr,.txt"></label><label>基础配置（JSON）<input type="file" name="base" accept=".json,application/json"></label><details><summary>查看或编辑已保存的内容</summary><label>.sr<textarea name="srText" spellcheck="false"></textarea></label><label>JSON<textarea name="baseText" spellcheck="false"></textarea></label></details><button>保存</button></form><button id="compile">编译已保存的文件</button></article></section>
<section id="links" hidden><h1>发布链接</h1><form id="newlink"><label>备注<input name="note" required></label><label>链接标识（留空随机生成）<input name="token" minlength="43" maxlength="43" pattern="[A-Za-z0-9._~\-]{43}"></label><button>新建链接</button></form><div id="linklist"></div></section>
<section id="admin" hidden><h1>服务设置</h1><form id="settings"><label>公开访问地址<input name="public" type="url" placeholder="https://rules.example.com" required></label><label>HTTP 监听（重启生效）<input name="listen" required></label><label>授权服务器 issuer<input name="issuer" type="url"></label><label>Client ID<input name="client"></label><label>资源标识 aud<input name="audience"></label><label>授权范围 scope<input name="scope"></label><label>允许导入的 HTTPS 规则集 URL（每行一个）<textarea name="imports"></textarea></label><button>保存设置</button></form>
<h2>身份授权</h2><div id="roles"></div><form id="role"><label>用户 sub<input name="sub" required></label><label>权限<select name="role"><option value="user">用户</option><option value="admin">管理员</option><option value="guest">访客</option></select></label><button>保存权限</button></form>
<h2>管理员密码</h2><p id="pwstate"></p><form id="password"><label>新密码<input name="password" type="password" autocomplete="new-password" required></label><button>更新密码</button></form><button id="removepass">删除管理员密码</button> <button id="purge">清除身份公钥缓存</button></section>
</main></body></html>
